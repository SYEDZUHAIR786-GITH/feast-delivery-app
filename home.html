<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feasto - Home</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <div class="home-container">
        <!-- Top Navigation Bar -->
        <nav class="top-navbar">
            <div class="navbar-content">
                <a href="order-tracking.html" class="nav-link">Orders</a>
                <a href="cart.html" class="nav-link">Cart</a>
                <a href="restaurant-menu.html" class="nav-link">Menu</a>
                <a href="#" class="nav-link active">Home</a>
                <a href="profile.html" class="nav-link">Profile</a>
                <a href="#" class="nav-link logout-link" onclick="logout(event)">Logout</a>
            </div>
        </nav>

        <!-- Header Section -->
        <div class="header-section">
            <h1 class="greeting" id="greetingText">Hi! Find your favorite food</h1>
            
            <!-- Search Bar -->
            <div class="search-container">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input 
                    type="text" 
                    class="search-input" 
                    placeholder="Search for dishes or restaurants"
                    id="searchInput"
                >
            </div>
        </div>

        <!-- Category Filter -->
        <div class="category-filter">
            <button class="category-btn active" data-category="all" onclick="filterByCategory('all')">All</button>
            <button class="category-btn" data-category="pizza" onclick="filterByCategory('pizza')">🍕 Pizza</button>
            <button class="category-btn" data-category="sushi" onclick="filterByCategory('sushi')">🍣 Sushi</button>
            <button class="category-btn" data-category="burger" onclick="filterByCategory('burger')">🍔 Burger</button>
            <button class="category-btn" data-category="dessert" onclick="filterByCategory('dessert')">🍰 Dessert</button>
            <button class="category-btn" data-category="drinks" onclick="filterByCategory('drinks')">🥤 Drinks</button>
            <button class="category-btn" data-category="starters" onclick="filterByCategory('starters')">🍗 Starters</button>
            <button class="category-btn more-btn">...</button>
        </div>

        <!-- Restaurant Grid -->
        <div class="restaurants-grid" id="restaurantsGrid">
            <!-- Restaurant cards will be inserted here by JavaScript -->
        </div>
    </div>

    <script src="home.js"></script>
</body>
</html>
